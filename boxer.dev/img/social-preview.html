<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Boxer social preview artwork</title>
  <!-- Render at 1200 × 630 with a device scale factor of 1 to regenerate the PNG. -->
  <style>
    html {
      color-scheme: light;
      background: #fff;
    }

    body {
      position: relative;
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      color: #111;
      font-family: "Times New Roman", Times, serif;
    }

    h1, p {
      position: absolute;
      left: 88px;
      margin: 0;
    }

    h1 {
      top: 92px;
      font-size: 76px;
      line-height: 1;
    }

    .headline {
      top: 220px;
      font-size: 44px;
      line-height: 1.15;
    }

    .positioning {
      top: 356px;
      font-size: 28px;
    }

    .benefits {
      top: 408px;
      font-size: 30px;
    }

    img {
      position: absolute;
      top: 168px;
      right: 100px;
      width: 220px;
      height: auto;
    }

    .url {
      bottom: 82px;
      font-size: 26px;
    }

    a {
      color: #00e;
    }
  </style>
</head>
<body>
  <h1>Boxer</h1>
  <p class="headline">A new compute primitive<br>for the next era.</p>
  <p class="positioning">Not a container. Not a VM. A category of its own.</p>
  <p class="benefits">Smaller. Safer. Faster. More universal.</p>
  <img src="boxer.png" alt="Mia St. John, a boxer throwing a punch" width="432" height="577">
  <p class="url"><a href="https://boxer.dev/">boxer.dev</a></p>
</body>
</html>
